# konoha runtime + code-level lifecycle defaults (#48).
# Precedence: env > file > bundled code default (see AGENTS.md/README.md).
# Strict: unknown keys / out-of-range values fail fast at startup.
# Per-repo policy lives in repos.yaml (this file only sets the FALLBACK defaults).

evidence:
  dir: .konoha/evidence           # #83: durable per-cycle evidence root (cycles/<id>/)
  sink: local                     # #100: storage backend; local only (S3/MinIO is a deferred seam)

# #102 host resource ceilings (best-effort anti-accident, NOT a security
# boundary; enforced on Linux via systemd-run else rlimits, no-op elsewhere).
# Unset = no ceilings. Per-repo override: lifecycle.limits in repos.yaml.
# maxWallClock must not exceed worker.devTimeout (the agent activity window).
# limits:
#   cpuMilli: 2000                # 2000m = 2 cores (systemd CPUQuota; rlimit derives CPU-seconds)
#   memoryMiB: 2048
#   diskMiB: 1024
#   maxWallClock: 30m

# #103 advisory network egress: sets HTTPS_PROXY/HTTP_PROXY/NO_PROXY on agent
# and validation children so well-behaved tools use the operator's allowlisting
# proxy. BYPASSABLE and NOT a security boundary — never labelled "enforced".
# Absent/unset proxy = today's behavior (no proxy env). outcome.json records
# egress.status: advisory + allowOut. Real enforcement is the sandbox path (#92).
# egress:
#   proxy: http://127.0.0.1:8888
#   allowOut: ["api.anthropic.com", "registry.npmjs.org"]

worker:
  taskQueue: review-queue
  maxConcurrentActivities: 10      # env override: WORKER_MAX_CONCURRENT_ACTIVITIES
  startToCloseTimeout: 15m         # default activity window for cycle/PR steps
  sweepTimeout: 10m                # sweep workflow activity window
  devTimeout: 45m                  # §4.4 agent dev/repair window (generous)
  retryMaxAttempts: 5              # #95 infrastructure-class activity retries (gh/git/evidence, backoff)
  sweepRetryMaxAttempts: 2         # sweep activity retries (unchanged by #95)
  cleanupMaxAttempts: 5            # #93 worktree teardown retries (idempotent)
  orphanWorktreeTTL: 24h           # #93 sweep a stranded worktree after this age

defaults:
  lifecycle:
    harness: opencode              # §85 agent harness name (opencode | generic)
    developmentMaxComplexity: 4    # §11 executable-child ceiling default
    maxDevReviewAttempts: 2        # §16 repair-loop cap default
    maxResolutionAttempts: 1       # §37 disagreement-resolution cap
    poGateTimeout: 168h            # §18/§33 human-response window default
    merge:                         # §49 PR merge + CI gate defaults
      strategy: squash             # squash | rebase | merge
      requireCI: true              # gate the merge on green CI (fail-closed)
      ciMaxWait: 10m               # bounded CI poll window