# konoha runtime + code-level lifecycle defaults (#48).
# Precedence: env > file > bundled code default (see AGENTS.md/README.md).
# Strict: unknown keys / out-of-range values fail fast at startup.
# Per-repo policy lives in repos.yaml (this file only sets the FALLBACK defaults).

evidence:
  dir: .konoha/evidence           # #83: durable per-cycle evidence root (cycles/<id>/)
  sink: local                     # #100: storage backend; local only (S3/MinIO is a deferred seam)

# #212 runtime selection. Temporal stays the default and the only durable /
# scheduled path. `local` runs the SMALL lifecycle sequentially in-process with
# no Temporal server (`prbot run`); it has no durability, replay, schedules,
# webhooks, child fan-out, queue verbs, or post-merge workflows.
# runtime:
#   mode: temporal                # temporal | local (closed set; default temporal)
#   local:
#     sweepInterval: 5m           # idle delay between sweeps
#     maxCycles: 1                # cycles per sweep per repo, >= 1
#     once: false                 # run one sweep and exit
#     approvalWait: 10m           # max wait at a §55 gate; timeout => BLOCKED

# #102 host resource ceilings (best-effort anti-accident, NOT a security
# boundary; enforced on Linux via systemd-run else rlimits, no-op elsewhere).
# Unset = no ceilings. Per-repo override: lifecycle.limits in repos.yaml.
# maxWallClock must not exceed worker.devTimeout (the agent activity window).
# limits:
#   cpuMilli: 2000                # 2000m = 2 cores (systemd CPUQuota; rlimit derives CPU-seconds)
#   memoryMiB: 2048
#   diskMiB: 1024
#   maxWallClock: 30m

# #103 advisory network egress: sets HTTPS_PROXY/HTTP_PROXY/NO_PROXY on agent
# and validation children so well-behaved tools use the operator's allowlisting
# proxy. BYPASSABLE and NOT a security boundary — never labelled "enforced".
# Absent/unset proxy = today's behavior (no proxy env). outcome.json records
# egress.status: advisory + allowOut. Real enforcement is the sandbox path (#92).
# egress:
#   proxy: http://127.0.0.1:8888
#   allowOut: ["api.anthropic.com", "registry.npmjs.org"]

# #104 narrow-only policy tenancy (Paddock Facility > Product Line >
# Department). A scope may only NARROW the global policy: it may reference only
# repos already in repos.yaml, built-in harness names, and defaults.agents
# model/budget names (an unknown ref fails at load); closePolicy may only become
# more human-gated; approval may only turn the §55 gate ON (and still needs
# lifecycle.audit.enabled). This is POLICY tenancy, NOT execution isolation —
# scopes share the host and there is NO per-tenant GitHub App credential
# (`GH_*` is unchanged, §23). See docs/non-goals.md B3. Resolution runs once at
# load; repos.yaml maps a repo by productLine/department or, by default, by
# membership in the scopes' repositories lists.
# scopes:
#   payments:                       # Product Line
#     repositories: ["acme/payments", "acme/payments-infra"]
#     harnesses: ["opencode"]
#     models: ["cheap", "strong"]
#     budgets: ["small"]
#     approval: true                # may only turn the gate ON
#     closePolicy: risk-based       # may only narrow (risk-based or stricter)
#     departments:                  # optional; may only narrow further
#       checkout:
#         repositories: ["acme/payments-checkout"]
#         models: ["strong"]

# #117 declarative agent profiles: bundle harness (#85), model (#98 catalog
# NAME), limits (#102), plus tools/mcp/promptMode into one named unit. A repo
# selects one per stage in repos.yaml (`lifecycle.agents.<stage>`, with a
# repo-level `default`). Resolved ONCE at load (apply.sh / prbot config) into the
# effective harness/model/limits, digested (#88) and carried in the schedule
# input — no workflow-side name resolution. An unknown profile/harness/model
# fails at load; tool/mcp refs are validated against the #119 catalog/registry
# (an unknown ref fails at load). A repo with no lifecycle.agents keeps legacy
# behavior; a conflicting legacy harness/model/limits key fails at load.
# agents:
#   cheap:
#     harness: opencode
#     model: cheap              # defaults.agents.models name
#   strong:
#     harness: opencode
#     model: strong
#     tools: [read, grep]       # #119 advisory allow list (recorded+digested; handed to a supporting harness)
#     deny: []                  # #119 hard deny list — any entry fails closed (§40)
#     mcp: [github]             # #119 named server from mcpServers: (resolved + written for a supporting harness)
#     limits: { memoryMiB: 2048 }
#     promptMode: arg

# #119 tool catalog + MCP registry. Built-in tool ids are code-level; custom
# tools are declared here. Named HTTP MCP servers are referenced by profile
# `mcp`; only the resolved set is handed to a supporting harness (#96). An
# unknown tool/server ref fails at load; nothing from issue text can grant one
# (§27).
# tools:
#   custom:
#     deploy-check: { description: "Verify a deploy" }
# mcpServers:
#   github:
#     url: "https://api.githubcopilot.com/mcp/"
#     headers: { Authorization: "Bearer ${GITHUB_MCP_TOKEN}" }  # git-excluded config only; never recorded

worker:
  taskQueue: review-queue
  maxConcurrentActivities: 10      # env override: WORKER_MAX_CONCURRENT_ACTIVITIES
  startToCloseTimeout: 15m         # default activity window for cycle/PR steps
  sweepTimeout: 10m                # sweep workflow activity window
  devTimeout: 45m                  # §4.4 agent dev/repair window (generous)
  retryMaxAttempts: 5              # #95 infrastructure-class activity retries (gh/git/evidence, backoff)
  sweepRetryMaxAttempts: 2         # sweep activity retries (unchanged by #95)
  cleanupMaxAttempts: 5            # #93 worktree teardown retries (idempotent)
  orphanWorktreeTTL: 24h           # #93 sweep a stranded worktree after this age

defaults:
  lifecycle:
    harness: opencode              # §85 agent harness name (opencode | generic)
    developmentMaxComplexity: 4    # §11 executable-child ceiling default
    maxDevReviewAttempts: 2        # §16 repair-loop cap default
    maxResolutionAttempts: 1       # §37 disagreement-resolution cap
    poGateTimeout: 168h            # §18/§33 human-response window default
    merge:                         # §49 PR merge + CI gate defaults
      strategy: squash             # squash | rebase | merge
      requireCI: true              # gate the merge on green CI (fail-closed)
      ciMaxWait: 10m               # bounded CI poll window

# #118 model-provider protocol abstraction (FOUNDATION; not yet wired to the
# agent harness). A provider names a wire protocol or a gateway preset and the
# credential NAME (never a value). Protocols: openai-responses | openai-chat |
# anthropic-messages. Gateways (OpenAI-chat baseUrl presets): openrouter |
# litellm | ollama. An unknown protocol/gateway, a gateway/protocol mismatch, or
# a non-bare apiKeyEnv fails at load. Providers are only built by
# newProviderRegistry (#118); no cycle path calls them yet.
# defaults:
#   providers:
#     anthropic:
#       protocol: anthropic-messages
#       apiKeyEnv: ANTHROPIC_API_KEY     # NAME only; the value is never read/recorded
#     openai:
#       protocol: openai-responses
#       apiKeyEnv: OPENAI_API_KEY
#     openrouter:
#       gateway: openrouter              # implies openai-chat + a default baseUrl
#       apiKeyEnv: OPENROUTER_API_KEY
#     local-ollama:
#       gateway: ollama                  # no key needed
