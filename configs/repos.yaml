# Repos tracked by the kakashi-82 review bot.
# One entry per repo. `schedule` is the cron interval for review sweeps.
# `lifecycle` is the per-repo policy (§33/§43 of docs/new-design-v2.md):
#   - mode: review-only | supervised-autonomous
#   - model: opencode agent model (provider/model, e.g. opencode-go/deepseek-v4.1-flash);
#     unset = built-in default
#   - developmentMaxComplexity: max complexity the developer handles (1-10)
#   - maxDevReviewAttempts: bounded review/fix loops
#   - autonomy.default/closePolicy + humanRequired*: escalation policy
#   - poGateTimeout: PO-on-fire timeout (Go duration)
#   - merge: {strategy, requireCI, ciMaxWait}: PR merge + CI gate (§49)
#   - validation: [{id, argv, mandatory, timeout, dir}] §26 structured verification
#     gates (bare argv, run in order, no early exit; aggregate passes iff every
#     mandatory gate exits 0). validationCmd: <shell string> is the legacy
#     fallback; declaring both is a load error. Per-gate streams land in the
#     cycle's evidence/verification/<id>.stdout|stderr.
#   - release: {enabled, changelogPath, versionPrefix}: post-merge release (§50)
#   - deps: {enabled, scanCmd, schedule, label, autoFileIssues}: dependency scan (§52)
#   - grooming: {enabled, selector, schedule, repoLabel, readyLabel}: §56 backlog
#     grooming — raw items carrying `selector` are analysed DRY and filed as ready
#     issues (label `readyLabel`, idempotent `<!-- konoha-groomed: <sha> -->`); an
#     unactionable item gets an idempotent note and is never auto-closed
#   - alerting: {enabled, notify, schedule, onRates, thresholds}: §53 rate alerts
#     + failure feedback (files one bug issue per BLOCKED/FAILED run)
#   - propagation: {enabled, maxPerMerge, downstream}: §54 cross-repo propagation
#     (downstream: {<repo>: {trigger: <changed-file glob>, type: <kind>}});
#     files one konoha:cross-repo issue per affected downstream, capped
#   - approval: {preGate, requiredSteps}: §55 pre-execution approval gate; when
#     preGate is on, each listed step (publish|merge|deploy; empty = all) waits
#     for a `<!-- konoha-decision: approve -->` within poGateTimeout; deny →
#     HUMAN_REQUIRED, timeout → BLOCKED (never a silent proceed)
#   - audit: {enabled, sink}: §55 append-only JSONL audit of every gated decision
#     (sink required when enabled, and required whenever approval.preGate is on);
#     fail-closed on a write error
#   - dryRun: true suppresses all GitHub mutations (§42 shadow mode)
#   - maxConcurrentIssueCycles / maxConcurrentChildrenPerIssue: §43 caps
# #104: a repo may name its tenancy scope explicitly with productLine (and an
# optional department); otherwise it maps to the konoha.yaml scope that lists it
# in `repositories`. Scopes are narrow-only policy, not execution isolation.
# Unknown keys or out-of-range values make `./apply.sh` fail fast.
repos:
  - repo: ducklambda
    owner: vitdo82
    repoPath: /Users/vit/projects/ducklambda
    schedule: "*/5 * * * *"
    lifecycle:
      mode: supervised-autonomous
      model: opencode-go/deepseek-v4.1-flash  # §4 agent model for this repo
      developmentMaxComplexity: 4
      maxDevReviewAttempts: 2
      autonomy:
        default: autonomous
        closePolicy: risk-based
        humanRequiredPaths:
          - ".github/**"
          - "infra/**"
          - "migrations/**"
        humanRequiredLabels:
          - "security"
          - "breaking-change"
      merge:
        strategy: squash
        requireCI: true
        ciMaxWait: 10m
      release:                  # §50 post-merge release + changelog
        enabled: false          # opt-in; false/unset = no-op
        changelogPath: CHANGELOG.md
        versionPrefix: v
      deps:                     # §52 dependency + security automation
        enabled: false          # opt-in; false/unset = no scan and no issues
        scanCmd: ""             # required when enabled; must print the JSON finding array
        schedule: 24h           # per-repo scan cadence (<repo>-deps Temporal schedule)
        label: konoha:dependency # base label; vulnerabilities also get konoha:security
        autoFileIssues: true    # false = scan/report only
      grooming:                 # §56 backlog grooming pre-stage
        enabled: false          # opt-in; false/unset = no <repo>-groom schedule, no ready issues
        selector: backlog       # label selecting raw backlog items to groom
        schedule: 24h           # per-repo cadence (<repo>-groom Temporal schedule)
        repoLabel: ""           # optional extra provenance label on the ready issue
        readyLabel: konoha:ready # label marking a groomed ready issue
      alerting:                 # §53 rate-drift alerts + failure feedback
        enabled: false          # opt-in; false/unset = no <repo>-alerts schedule, no bug issues
        notify: ""              # webhook URL (slack-compatible); empty = log only
        schedule: 24h           # evaluation cadence (<repo>-alerts Temporal schedule)
        onRates: []             # optional subset; empty = every configured threshold
        thresholds:             # autonomous rate alerts below; all others above
          autonomous_completion_rate: 0.7
          human_escalation_rate: 0.3
      propagation:              # §54 cross-repo change propagation
        enabled: false          # opt-in; false/unset = no downstream issues
        maxPerMerge: 3          # fan-out cap per merge (default 3)
        # downstream:           # map: downstream repo → what triggers it
        #   other-repo:
        #     trigger: "pkg/api/**"
        #     type: breaking
      approval:                 # §55 pre-execution approval gate
        preGate: false          # opt-in; true = wait for a human before the steps below
        requiredSteps: [publish, merge, deploy]  # closed set; empty = all steps
      audit:                    # §55 append-only audit (JSONL) of gated decisions
        enabled: false          # opt-in; sink is required when true
        sink: ""                # e.g. /var/log/konoha-audit.jsonl
      poGateTimeout: 168h
      dryRun: false
      maxConcurrentIssueCycles: 1
      maxConcurrentChildrenPerIssue: 3